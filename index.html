<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f2">
  <title>스티커 인쇄</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="pdfwriter.js"></script>
  <script src="calibration.js"></script>
  <script src="photo.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <main>
    <div class="titlebar">
      <h1>스티커 인쇄</h1>
      <span class="sub" id="countNote"></span>
    </div>

    <div id="sheet" class="sheet"></div>
    <p class="status" id="status" aria-live="polite"></p>

    <button id="pickBtn" class="big">사진 고르기</button>
    <button id="printBtn" class="big primary">인쇄하기</button>

    <p class="tip">인쇄 화면에서 <b>용지: 엽서</b>, <b>배율 100%</b></p>

    <a class="link" href="test.html">인쇄 위치 맞추기</a>
  </main>

  <!-- 사진 고르기 (화면에는 안 보임) -->
  <input id="manyInput" type="file" accept="image/*" multiple hidden>
  <input id="oneInput" type="file" accept="image/*" hidden>

  <!-- 칸 메뉴 -->
  <div id="menu" class="menu" hidden>
    <div class="menu-panel" role="dialog" aria-labelledby="menuTitle">
      <h2 id="menuTitle"></h2>
      <button id="menuReplace" class="big">사진 바꾸기</button>
      <button id="menuRotate" class="big">90° 돌리기</button>
      <button id="menuClear" class="big danger">비우기</button>
      <button id="menuClose" class="link">닫기</button>
    </div>
  </div>
</body>
</html>
