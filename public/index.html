<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0e12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hongido">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Hongido_Stickers</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="pdfwriter.js"></script>
  <script src="calibration.js"></script>
  <script src="filters.js"></script>
  <script src="photo.js"></script>
  <script src="editor.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</head>
<body class="app">
  <main class="layout">
    <header class="topbar">
      <h1 class="brand" aria-label="홍이도 스티커">
        <span class="brand-word" aria-hidden="true">hongid<img class="brand-face" src="hongido-face.png" alt=""></span>
        <span class="brand-sub" aria-hidden="true">홍이도 스티커</span>
      </h1>
      <button class="icon-btn round" id="settingsBtn" aria-label="설정"><span data-icon="settings"></span></button>
    </header>

    <div class="chips">
      <button class="chip chip-btn" id="paperChip" aria-label="용지 판형 바꾸기"><span data-icon="paper"></span><span id="paperChipText"></span><span class="chev" data-icon="chevron"></span></button>
      <span class="chips-right">
        <span class="count" id="countChip" aria-live="polite"></span>
        <button class="new-sheet" id="newSheetBtn" hidden>모두 비우기</button>
      </span>
    </div>

    <div class="stage" id="stage">
      <div id="paper" class="paper">
        <p class="empty-hint" id="emptyHint">칸을 눌러 사진을 고르세요</p>
        <span class="sheet-label" id="sheetLabel" aria-hidden="true"></span>
      </div>
    </div>
  </main>

  <div class="bottombar">
    <button id="printBtn" class="print-btn"><span class="icon" id="mainIcon"></span><span id="mainLabel">PRINT</span></button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 사진 준비 중: 화면을 잠그고 진행 상황 표시 -->
  <div id="busy" class="busy" hidden aria-live="polite">
    <div class="busy-box"><span class="spinner"></span><span id="busyText"></span></div>
  </div>

  <!-- 사진 고르기 (화면에는 안 보임) -->
  <input id="manyInput" type="file" accept="image/*" multiple hidden>
  <input id="oneInput" type="file" accept="image/*" hidden>

  <!-- 사진 편집 화면 -->
  <div id="editor" class="editor" hidden role="dialog" aria-labelledby="editorTitle">
    <header class="editor-bar">
      <button id="editorCancel" class="text-btn">취소</button>
      <h2 id="editorTitle"></h2>
      <button id="editorDone" class="text-btn accent">완료</button>
    </header>
    <div id="editorStage" class="editor-stage">
      <canvas id="editorCanvas"></canvas>
      <span id="editorInfo" class="editor-info"></span>
      <span class="editor-hint">한 손가락 이동 · 두 손가락 확대·회전</span>
    </div>
    <div class="filter-panel">
      <div class="filter-head">
        <span>필터</span>
        <button id="applyAllBtn" class="apply-all" aria-pressed="false">모든 칸에 적용</button>
      </div>
      <div class="filter-amount" id="filterAmountRow" hidden>
        <span id="filterAmountLabel"></span>
        <input id="filterAmount" type="range" min="0" max="100" step="1" value="100" aria-label="필터 강도">
        <span id="filterAmountValue"></span>
      </div>
      <div class="filter-strip" id="filterStrip"></div>
    </div>
    <div class="editor-tools">
      <button id="editorRotate" class="tool"><span data-icon="rotate"></span>90°</button>
      <button id="editorFit" class="tool"><span data-icon="fit"></span>맞춤</button>
      <button id="editorReplace" class="tool"><span data-icon="replace"></span>바꾸기</button>
      <button id="editorClear" class="tool danger"><span data-icon="trash"></span>비우기</button>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="overlay" hidden>
    <div class="panel" role="dialog" aria-labelledby="settingsTitle">
      <div class="grabber"></div>
      <h2 id="settingsTitle">설정</h2>
      <div class="settings-list">
        <label class="setting-row">
          <span>인쇄 전 확인 화면<small>PRINT를 누르면 용지·배율을 먼저 보여 줘요</small></span>
          <span class="switch"><input id="setPreflight" type="checkbox"><span></span></span>
        </label>
        <label class="setting-row">
          <span>작은 스티커용 인쇄 보정<small>조금 밝게·선명하게·진하게 찍혀요</small></span>
          <span class="switch"><input id="setPrintFix" type="checkbox"><span></span></span>
        </label>
        <a class="setting-row link-row" id="calibRow" href="test.html">
          <span>인쇄 위치 맞추기<small>시험 인쇄로 칸 위치를 맞춰요</small></span>
          <span class="icon chev-right" data-icon="chevronRight"></span>
        </a>
      </div>
    </div>
  </div>

  <!-- 판형 고르기 -->
  <div id="presetMenu" class="overlay" hidden>
    <div class="panel" role="dialog" aria-labelledby="presetTitle">
      <div class="grabber"></div>
      <h2 id="presetTitle">용지 고르기</h2>
      <p class="panel-sub">가지고 있는 용지에 맞춰 칸이 바뀌어요</p>
      <div id="presetList" class="preset-list"></div>
    </div>
  </div>

  <!-- 인쇄 전 확인 -->
  <div id="preflight" class="overlay" hidden>
    <div class="panel" role="dialog" aria-labelledby="preflightTitle">
      <div class="grabber"></div>
      <h2 id="preflightTitle">인쇄 화면에서 이렇게 맞춰 주세요</h2>
      <p class="panel-sub" id="preflightPaper"></p>
      <div class="checklist">
        <div class="row"><span data-icon="paper"></span><span class="row-label">용지 크기</span><b id="pfPaper"></b></div>
        <div class="row"><span data-icon="scale"></span><span class="row-label">배율</span><b id="pfScale"></b></div>
      </div>
      <p class="panel-note" id="pfNote"></p>
      <button id="preflightGo" class="accent-btn">확인하고 인쇄</button>
      <label class="check"><input id="skipPreflight" type="checkbox"><span>다음부터 바로 인쇄</span></label>
    </div>
  </div>
</body>
</html>
