<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hongido">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Hongido_Stickers</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="pdfwriter.js"></script>
  <script src="calibration.js"></script>
  <script src="photo.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</head>
<body class="app">
  <main class="layout">
    <header class="topbar">
      <h1 id="appTitle"></h1>
      <a class="icon-btn" href="test.html" aria-label="설정"><span data-icon="settings"></span></a>
    </header>

    <div class="chips">
      <span class="chip"><span data-icon="paper"></span><span id="paperChip"></span></span>
      <span class="chip count" id="countChip"></span>
    </div>

    <div class="stage">
      <div id="paper" class="paper"></div>
    </div>
    <p class="empty-hint" id="emptyHint">칸을 눌러 사진을 고르세요</p>
  </main>

  <div class="bottombar">
    <button id="printBtn" class="print-btn"><span data-icon="printer"></span><span>PRINT</span></button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 사진 고르기 (화면에는 안 보임) -->
  <input id="manyInput" type="file" accept="image/*" multiple hidden>
  <input id="oneInput" type="file" accept="image/*" hidden>

  <!-- 사진 편집 화면 -->
  <div id="editor" class="editor" hidden role="dialog" aria-labelledby="editorTitle">
    <header class="editor-bar">
      <button id="editorCancel" class="text-btn">취소</button>
      <h2 id="editorTitle"></h2>
      <button id="editorDone" class="text-btn accent">완료</button>
    </header>
    <div id="editorStage" class="editor-stage">
      <canvas id="editorCanvas"></canvas>
      <span id="editorInfo" class="editor-info"></span>
      <span class="editor-hint">한 손가락 이동 · 두 손가락 확대·회전</span>
    </div>
    <div class="editor-tools">
      <button id="editorRotate" class="tool"><span data-icon="rotate"></span>90°</button>
      <button id="editorFit" class="tool"><span data-icon="fit"></span>맞춤</button>
      <button id="editorReplace" class="tool"><span data-icon="replace"></span>바꾸기</button>
      <button id="editorClear" class="tool danger"><span data-icon="trash"></span>비우기</button>
    </div>
  </div>

  <!-- 인쇄 전 확인 -->
  <div id="preflight" class="overlay" hidden>
    <div class="panel" role="dialog" aria-labelledby="preflightTitle">
      <div class="grabber"></div>
      <h2 id="preflightTitle">인쇄 화면에서 이렇게 맞춰 주세요</h2>
      <p class="panel-sub" id="preflightPaper"></p>
      <div class="checklist">
        <div class="row"><span data-icon="paper"></span><span class="row-label">용지 크기</span><b id="pfPaper"></b></div>
        <div class="row"><span data-icon="scale"></span><span class="row-label">배율</span><b id="pfScale"></b></div>
      </div>
      <p class="panel-note">'용지에 맞춤'이 켜져 있으면 칸이 어긋나요.</p>
      <button id="preflightGo" class="accent-btn">확인하고 인쇄</button>
      <label class="check"><input id="skipPreflight" type="checkbox"><span>다음부터 바로 인쇄</span></label>
    </div>
  </div>
</body>
</html>
